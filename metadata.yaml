name: astrbot_plugin_group_active_distiller
display_name: 群友主动蒸馏器
desc: 主动搜索并抓取 QQ 群历史消息，分块喂给 LLM 蒸馏出可投放的「人设卡」：人格、说话习惯、表情包/口癖习惯、场景话题画像，自带可视化蒸馏台。
short_desc: 主动采集群消息 → 蒸馏人设 / 说话风格 / 表情包习惯 + 可视化后台
help: |
  主动蒸馏器（与被动蒸馏插件不同：不等群里有人说话，主动去搜群、拉历史、喂模型）

  ★ 核心用法：直接喂一个 QQ 号，自动扫遍机器人所在的所有群，
    把这个号在每群能拿到的聊天记录全部拉下来，跨群合并后分批喂给 LLM。

  指令：
    /蒸馏 追踪 <QQ号>            扫描全部群 → 拉该号所有记录 → 跨群分批蒸馏（一步到位）
    /蒸馏 追踪 <QQ号> --no-collect   只蒸馏库里已有数据，不联网采集
    /蒸馏 追踪 <QQ号> --full        强制全量重新拉取
    /蒸馏 追踪 <QQ号> --count 800   每群拉 800 条（默认走配置值）
    /蒸馏 搜索蒸馏 <QQ号>         只采集不蒸馏：看他在哪些群、各有多少条
    /蒸馏 帮助
    /蒸馏 搜群 关键词           搜索机器人所在群（按群名/群号）
    /蒸馏 采集 <群号> [数量]     主动拉取该群历史消息入库（增量）
    /蒸馏 群列表                列出已登记群与消息量
    /蒸馏 对象 <群号>           列出该群消息量靠前的群友（候选蒸馏对象）
    /蒸馏 蒸馏 <群号> <QQ号>     只蒸该号在某一个群里的表现（群内人设）
    /蒸馏 批量 <群号> [人数]     批量蒸馏该群 Top N 群友
    /蒸馏 画像 [QQ号]           查看已生成的画像（带「跨群」或群号标记）
    /蒸馏 投放 <QQ号>           把画像转成可直接用的 system prompt 文本
    /蒸馏 状态                 查看采集/蒸馏任务状态与用量
    /蒸馏 后台                 输出可视化蒸馏台地址
